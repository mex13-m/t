<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محمّل الفيديو</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>📥 محمّل الفيديو</h1>
    <p class="sub">TikTok • YouTube • Facebook</p>

    <div class="row">
      <input id="url" type="url" placeholder="ألصق رابط الفيديو هنا" autocomplete="off">
      <button id="paste" type="button" title="لصق">📋</button>
    </div>
    <button id="fetch" class="primary">جلب الفيديو</button>

    <p id="msg" class="msg" hidden></p>

    <section id="result" hidden>
      <img id="thumb" alt="">
      <h2 id="title"></h2>
      <p id="meta" class="sub"></p>
      <label for="quality">الجودة</label>
      <select id="quality"></select>
      <button id="download" class="primary">⬇️ تحميل</button>
    </section>

    <p class="note">حمّل فقط المحتوى الذي تملكه أو لديك إذن بتحميله.</p>
  </main>
  <script src="script.js"></script>
</body>
  </html>
